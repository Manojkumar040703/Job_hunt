services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: job-hunt-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./jobhunt.db
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"

  # 2. Vite + React Frontend Static Site
  - type: web
    name: job-hunt-frontend
    runtime: static
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: job-hunt-backend
          envVarKey: RENDER_EXTERNAL_URL
          transformation:
            suffix: /api
